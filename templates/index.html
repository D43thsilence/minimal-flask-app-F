<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Object Exhibition</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #e1f8ff;
            font-family: "Times New Roman", Times, serif;
        }

        .objectDisplay {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            align-items: flex-start;
        }

        .objectDisplay>div {
            background-color: #f7f7f7;
            padding: 20px;
            border: ridge;
        }

        p {
            font-size: 16px;
            border-bottom: 1px solid #000;
            padding-bottom: 10px;
        }

        .generated-image {
            max-width: 500px;
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <div class="container text-center mt-5">

        <h1 class="display-4">
            Describe your exhibition object and get it exhibited with its label
        </h1>

        <form method="POST" class="mx-auto col-md-8 col-lg-6">

            <div class="mb-3">
                <textarea name="prompt" rows="4" class="form-control" placeholder="Enter your prompt..."
                    required></textarea>
            </div>

            <div class="d-grid">
                <input type="submit" value="Generate Exhibition" class="btn btn-primary">
            </div>

        </form>

        {% if result %}
        <div class="objectDisplay">
            {% if image %}
            <div>
                <img src="data:image/png;base64,{{ image }}" alt="Generated image" class="generated-image">
                <!-- <img src="/image" alt="Generated image"> -->
            </div>
            <!-- {% endif %} -->

            <div>
                <p>
                    {{ result }}
                </p>

                <p>
                    {{ resultDescription }}
                </p>
            </div>

        </div>
        {% endif %}

    </div>

</body>

</html>
