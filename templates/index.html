<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated object exhibition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        body {
            background-color: #e1f8ff;
            background-repeat: no-repeat;
            font-family: 'Times New Roman', Times, serif;
        }

        .objectDisplay {
            display: flex;
            /* background-color: rgb(145, 116, 37); */
        }

        .objectDisplay div {
            background-color: #f7f7f7;
            margin: 10px;
            padding: 20px;
            font-size: 14px;
            border-style: ridge;
            font-family: Arial, Helvetica, sans-serif;
        }

        p {
            border-bottom-style: solid;
            /* border-bottom: #000000; */
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container text-center mt-5">
        <h1 class="display-4">Describe your exhibition object and get it exhibited with its label</h1>
        <form method="POST" class="mx-auto col-md-8 col-lg-6">
            <div class="mb-3">
                <textarea name="prompt" rows="4" class="form-control" placeholder="Enter your prompt..."></textarea>
            </div>
            <div class="d-grid">
                <input type="submit" value="Submit" class="btn btn-primary">
            </div>
        </form>
    </div>
</body>

<body>
    {% if result %}
    <div class="objectDisplay">
        <div><img src="http://127.0.0.1:5000/image" alt="Output"></div>
        <div>
            <p>
                {{ result }}
            </p>
            <p>
                {{ resultDescription }}
            </p>
        </div>
    </div>
    {% endif %}
</body>

</html>
